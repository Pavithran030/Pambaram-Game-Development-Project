name: Deploy Pambaram Web (GitHub Pages)

on:
  push:
    branches: [ main, deployment ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and web build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt

      - name: Run headless test suite
        run: |
          python tests/test_ui.py
          python tests/test_integration.py
          python tests/test_match_flow.py
          python tests/test_production.py
          python tests/test_web_deploy.py

      - name: Stage clean package and build WebAssembly bundle
        run: |
          python scripts/stage_web.py --build

      - name: Verify web build outputs
        run: |
          test -f build_src/pambaram/build/web/index.html
          test -f build_src/pambaram/build/web/pambaram.tar.gz
          test -f build_src/pambaram/build/web/favicon.png

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build_src/pambaram/build/web"

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
